<!DOCTYPE html>
<html>
<head>
  <title>AI FAQ Assistant</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin: 40px auto; }
    input { width: 70%; padding: 10px; }
    button { padding: 10px 16px; }
    #answer { margin-top: 20px; padding: 12px; background: #eef; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>AI FAQ Assistant</h2>
  <input id="q" placeholder="Ask your question...">
  <button onclick="ask()">Ask</button>
  <div id="answer"></div>

  <script>
    async function ask() {
      const question = document.getElementById("q").value;
      const res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question})
      });
      const data = await res.json();
      document.getElementById("answer").innerText = data.answer;
    }
  </script>
</body>
</html>
